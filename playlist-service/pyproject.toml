[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
# E501 (línea larga) no se aplica retroactivamente: el repo preexistente
# tiene líneas largas sin valor funcional en reformatearlas ahora; el
# límite de 100 en [tool.ruff] sigue aplicando al fixer/formatter.
ignore = ["E501"]
