name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, history-service, streaming-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.work
          # Por default setup-go busca go.sum en la raíz del repo para el
          # cache de módulos; acá vive uno por servicio (más shared-go),
          # así que sin esto el cache siempre fallaba (no rompía el build,
          # solo lo hacía más lento).
          cache-dependency-path: |
            backend/${{ matrix.service }}/go.sum
            backend/shared-go/go.sum

      # go.work referencia ./shared-go y los 3 servicios Go desde
      # backend/, así que build/vet/test corren dentro del directorio del
      # servicio pero resuelven vibestream/shared vía el workspace.
      - name: go build
        run: go build ./...
        working-directory: backend/${{ matrix.service }}

      - name: go vet
        run: go vet ./...
        working-directory: backend/${{ matrix.service }}

      - name: go test
        run: go test ./... -v
        working-directory: backend/${{ matrix.service }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # golangci-lint-action@v6 no soporta golangci-lint v2 (falla con
          # "invalid version string" en runtime, no en desarrollo local
          # porque ahí se usó la imagen Docker directamente, sin pasar por
          # esta acción — encontrado recién al ver el primer run real de
          # GitHub Actions, exactamente lo que Fase 5 dejó como pendiente
          # de confirmar). v7 sí soporta v2.
          version: v2.1.6
          working-directory: backend/${{ matrix.service }}
          # .golangci.yml vive en backend/; golangci-lint lo encuentra
          # solo caminando hacia arriba desde working-directory.

  python:
    name: python / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - artist-service
          - content-service
          - playlist-service
          - search-service
          - subscription-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: backend/${{ matrix.service }}
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          # vibestream_common no está en requirements.txt (se instala vía
          # COPY+pip install en el Dockerfile); en CI se instala en modo
          # editable desde el paquete compartido del repo.
          pip install -e ../shared-python

      - name: ruff check
        working-directory: backend/${{ matrix.service }}
        run: ruff check .

      - name: pytest
        working-directory: backend/${{ matrix.service }}
        # "python -m pytest" (no el script "pytest" suelto): agrega el
        # directorio del servicio a sys.path, que es lo que permite que
        # los tests importen paquetes locales como "database"/"config"
        # sin necesitar instalar el servicio como paquete.
        run: python -m pytest tests/ -v
