[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibestream-common"
version = "0.1.0"
description = "Código compartido entre los microservicios Python de VibeStream (auth middleware, conexión a BD, config base, manejo de errores)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "PyJWT>=2.10",
    "SQLAlchemy>=2.0",
]

[tool.setuptools.packages.find]
include = ["vibestream_common*"]
