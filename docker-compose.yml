
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      # Deben coincidir con db_url_py/DB_URL en .env (docker-compose no
      # soporta variables derivadas de otras variables dentro del mismo
      # .env, mismo caso que RABBITMQ_USER/PASS vs RABBITMQ_URL).
      POSTGRES_USER: ${POSTGRES_USER:-vibestream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibestream}
      POSTGRES_DB: ${POSTGRES_DB:-vibestream}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # schema_reconstruido.sql es el snapshot completo de todas las
      # tablas: bootstrap de una BD nueva. Alembic (content-service,
      # artist-service) gestiona el drift incremental a partir de acá,
      # no el bootstrap inicial — ver PLAN.md, Fase 6.
      - ./schema_reconstruido.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibestream} -d ${POSTGRES_DB:-vibestream}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vibestream-network

  localstack:
    image: localstack/localstack:3.8
    container_name: localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-vibestream-media}
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - vibestream-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      # Fase 6: antes hardcodeado a guest/guest. Si se cambia acá,
      # también hay que actualizar RABBITMQ_URL en .env para que
      # coincida (docker-compose no permite variables derivadas de
      # otras variables dentro del mismo .env).
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - vibestream-network

  artist-service:
    build:
      context: .
      dockerfile: artist-service/Dockerfile
      args:
        - SERVICE_NAME=artist-service
        - SERVICE_PORT=${ARTIST_PORT:-8002}
    container_name: artist-service
    restart: unless-stopped
    ports:
      - "${ARTIST_PORT:-8002}:${ARTIST_PORT:-8002}"
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - vibestream-network

  content-service:
    build:
      context: .
      dockerfile: content-service/Dockerfile
      args:
        - SERVICE_NAME=content-service
        - SERVICE_PORT=${CONTENT_PORT:-8001}
    container_name: content-service
    restart: unless-stopped
    ports:
      - "${CONTENT_PORT:-8001}:${CONTENT_PORT:-8001}"
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - vibestream-network

  playlist-service:
    build:
      context: .
      dockerfile: playlist-service/Dockerfile
      args:
        - SERVICE_NAME=playlist-service
        - SERVICE_PORT=${PLAYLIST_PORT:-8004}
    container_name: playlist-service
    restart: unless-stopped
    ports:
      - "${PLAYLIST_PORT:-8004}:${PLAYLIST_PORT:-8004}"
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - vibestream-network

  search-service:
    build:
      context: .
      dockerfile: search-service/Dockerfile
      args:
        - SERVICE_NAME=search-service
        - SERVICE_PORT=${SEARCH_PORT:-8006}
    container_name: search-service
    restart: unless-stopped
    ports:
      - "${SEARCH_PORT:-8006}:${SEARCH_PORT:-8006}"
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - vibestream-network

  subscription-service:
    build:
      context: .
      dockerfile: subscription-service/Dockerfile
      args:
        - SERVICE_NAME=subscription-service
        - SERVICE_PORT=${SUBSCRIPTION_PORT:-8007}
    container_name: subscription-service
    restart: unless-stopped
    ports:
      - "${SUBSCRIPTION_PORT:-8007}:${SUBSCRIPTION_PORT:-8007}"
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - vibestream-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
      args:
        - SERVICE_NAME=auth-service
        - SERVICE_PORT=${AUTH_PORT:-8080}
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-8080}:${AUTH_PORT:-8080}"
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - vibestream-network

  history-service:
    build:
      context: .
      dockerfile: history-service/Dockerfile
      args:
        - SERVICE_NAME=history-service
        - SERVICE_PORT=${HISTORY_PORT:-8005}
    container_name: history-service
    restart: unless-stopped
    ports:
      - "${HISTORY_PORT:-8005}:${HISTORY_PORT:-8005}"
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - vibestream-network

  streaming-service:
    build:
      context: .
      dockerfile: streaming-service/Dockerfile
      args:
        - SERVICE_NAME=streaming-service
        - SERVICE_PORT=${STREAMING_PORT:-8003}
    container_name: streaming-service
    restart: unless-stopped
    ports:
      - "${STREAMING_PORT:-8003}:${STREAMING_PORT:-8003}"
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - vibestream-network

  front_music_stm:
    build:
      context: ./front_music_stm
    container_name: front_music_stm
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - auth-service
      - search-service
      - content-service
      - artist-service
      - playlist-service
      - subscription-service
      - history-service
      - streaming-service
    environment:
      - NODE_ENV=production
    networks:
      - vibestream-network

networks:
  vibestream-network:
    driver: bridge

volumes:
  postgres_data:
  localstack_data:

